<style>

function traits(){const t={};T.forEach(k=>t[k]=0);for(const k in S.answers){const w=S.answers[k];if(w&&typeof w==='object')for(const x in w)if(x in t)t[x]+=+w[x]||0}return t}

const topT=()=>rank()[0],second=()=>rank()[1];
const _rc={};
function rarity(){const key=S.earthId+JSON.stringify(S.answers);if(_rc[key]!=null)return _rc[key];const qs=[].concat(QL(1),QL(2)),r=rng(hash(S.earthId+'sim')),tg=[topT(),second()],N=4000;let hit=0;for(let i=0;i<N;i++){const t={};T.forEach(k=>t[k]=0);qs.forEach(q=>{let w;if(q.s){const v=r()*100;w={soc:Math.round(v/25),ind:Math.round((100-v)/25)}}else w=q.o[Math.floor(r()*q.o.length)][1];for(const x in w)t[x]+=w[x]});const rk=T.slice().sort((a,b)=>t[b]-t[a]||hash(S.earthId+a)-hash(S.earthId+b));if(rk[0]===tg[0]&&rk[1]===tg[1])hit++}return _rc[key]=Math.max(.1,Math.round(hit/N*1000)/10)}
const inner=()=>{const t=traits(),m=(k,x)=>Math.min(97,Math.max(38,40+Math.round(x*5.2)+hash(S.earthId+k)%7));return[['Curiosity','কৌতূহল',m('a',t.cur+t.exp/2)],['Imagination','কল্পনা',m('b',t.ima+t.cre/2)],['Independence','স্বাধীনতা',m('c',t.ind+t.lead/2)],['Social Energy','সামাজিক শক্তি',m('d',t.soc)],['Patience','ধৈর্য',m('e',t.pat)],['Exploration','অনুসন্ধান',m('f',t.exp+t.lead/2)]]};

const AYAH=[['Do your part with full effort, then leave the result in the hands of the One who is wiser than your worry.','পুরো চেষ্টাটা তুমি করো, তারপর ফলাফল ছেড়ে দাও তাঁর হাতে, যিনি তোমার দুশ্চিন্তার চেয়ে অনেক বেশি জানেন।'],['Hard days are not a sign you were forgotten. Often they are the doorway to something kinder that has not arrived yet.','কঠিন দিন মানে এই নয় যে তুমি ভুলে যাওয়া হয়েছ। অনেক সময় এগুলোই সেই দরজা, যার ওপারে এখনো না-আসা একটা সুন্দর কিছু অপেক্ষা করছে।'],['Gratitude is a quiet kind of wealth. Count what you already have today, and watch your heart grow lighter.','কৃতজ্ঞতা এক নীরব সম্পদ। আজ যা আছে তা গুনে দেখো, মনটা হালকা হয়ে আসবে।'],['Patience is not waiting without moving. It is moving steadily while trusting the timing.','ধৈর্য মানে হাত গুটিয়ে বসে থাকা নয়। ধৈর্য মানে সময়ের ওপর ভরসা রেখে ধীরে ধীরে এগিয়ে চলা।'],['Your worth was never decided by your worst day. Begin again. The door of beginning never closes.','তোমার মূল্য তোমার সবচেয়ে খারাপ দিনটা ঠিক করে দেয় না। আবার শুরু করো। শুরুর দরজা কখনো বন্ধ হয় না।'],['Be kind in secret. Some of the best things you will ever do will be known to no one but your Creator.','গোপনে ভালো করো। তোমার সবচেয়ে সুন্দর কিছু কাজ হয়তো তোমার স্রষ্টা ছাড়া আর কেউ জানবে না।'],['Seek knowledge the way you seek light in a dark room: gently, and with thanks for every step it shows you.','জ্ঞান খোঁজো অন্ধকার ঘরে আলো খোঁজার মতো করে: ধীরে, আর প্রতিটা পদক্ষেপ দেখানোর জন্য কৃতজ্ঞ থেকে।'],['What was meant for you will find you. Keep your heart clean and your effort honest.','যা তোমার জন্য লেখা, তা তোমাকে খুঁজে নেবে। মন পরিষ্কার রাখো, চেষ্টা সৎ রাখো।'],['Do not compare your chapter three to someone else\'s chapter thirty. Every soul has its own pace and its own purpose.','তোমার তৃতীয় অধ্যায়কে অন্যের ত্রিশ নম্বর অধ্যায়ের সঙ্গে মেলাতে যেয়ো না। প্রতিটা মানুষের নিজের গতি আছে, নিজের উদ্দেশ্য আছে।'],['A sincere intention turns small acts into something that lasts. Mean what you do.','আন্তরিক নিয়ত ছোট কাজকেও টেকসই করে তোলে। যা করো, মন থেকে করো।'],['When you feel alone, remember that your heart can always turn upward, and that line is never busy.','একা লাগলে মনে রেখো, তোমার মন সবসময় ওপরের দিকে ফিরতে পারে, আর সেই যোগাযোগ কখনো ব্যস্ত থাকে না।'],['Forgive, and you free your own hands. Hold less grudge, carry more peace.','ক্ষমা করলে নিজের হাতই মুক্ত হয়। রাগ কম ধরে রাখো, শান্তি বেশি বহন করো।'],['Make tomorrow better by being honest with yourself tonight.','আজ রাতে নিজের কাছে সৎ হও। কালকের দিনটা তাতেই ভালো হতে শুরু করবে।'],['Calm is a strength. When the noise rises, return to your breath and your purpose.','শান্ত থাকা একটা শক্তি। কোলাহল বাড়লে নিজের শ্বাসে আর নিজের উদ্দেশ্যে ফিরে এসো।'],['Use what you have been given to lift someone else. That is how a gift becomes a blessing.','তোমাকে যা দেওয়া হয়েছে, তা দিয়ে অন্য কাউকে তুলে ধরো। এভাবেই উপহার হয়ে ওঠে রহমত।'],['You are asked to try, not to be perfect. Take the next small step with a hopeful heart.','তোমার কাছে চেষ্টা চাওয়া হয়েছে, নিখুঁত হওয়া নয়। আশা নিয়ে পরের ছোট পদক্ষেপটা নাও।']];
